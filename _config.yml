# Site settings
title: My Portfolio
description: Professional portfolio – projects, skills and experience.
url: "https://isuruvh.github.io"
baseurl: ""            # keep empty for a user site (isuruvh.github.io)

# Author info (used by some themes / SEO tag)
author: Isuru Vijayanga Heendeniya
# github_username: Isuruvh
# linkedin_username: your-handle
# email: you@example.com

# Theme – GitHub Pages supported themes: minima, cayman, minimal, slate,
# midnight, architect, time-machine, etc.
#theme: minima
#theme: jekyll-theme-minimal
remote_theme: jekyll/minima@v2.5.1

# Alternatively use a remote theme:
# remote_theme: pages-themes/cayman@v0.2.0

# Header navigation (minima) – shows on every page
header_pages:
  - README.md
  - credentials.md
  - coding-certificates.md
  - microsoft-credentials.md
  - microsoft-applied-skills.md
  - okta-skill-badges.md
  - auth0-skill-badges.md
  - global-ai-community-credentials.md
# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
 # - jekyll-remote-theme   # only needed if you use remote_theme

# Treat README.md as a normal page (don't exclude it)
include:
  - README.md

# Files/folders Jekyll should ignore
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
